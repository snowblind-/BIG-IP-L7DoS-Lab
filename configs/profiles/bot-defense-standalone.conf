#-----------------------------------------------------------------------------
# Scenario 3.3 (extended) - Standalone Bot Defense profile
#
# Demonstrates capabilities the DoS-profile's proactive bot defense cannot:
#   * JavaScript challenge BEFORE vs AFTER access (browser verification action)
#   * Per-class bot mitigation (browser / trusted / untrusted / malicious)
#   * Bot-signature CATEGORY exceptions (allow search engines, block tools)
#   * Per-bot RATE LIMITS (rate-limit + rate-limit-tps on a class or signature)
#   * URL / source allowlist exceptions
#
# Applies to BIG-IP 14.1+ (security bot-defense profile object); lab target 17.1.0.1.
#
# Load (merge) this snippet, then bind it to the virtual server via an
# LTM policy or Security > Policies > Bot Defense Profile:
#   tmsh load sys config merge file /var/tmp/bot-defense-standalone.conf
#   tmsh modify ltm virtual lab-vs profiles add { lab-bot-defense }
#
# NOTE: signature names under signature-overrides are environment-specific.
# Confirm what is installed first:  tmsh list security bot-defense signature
#-----------------------------------------------------------------------------

security bot-defense profile lab-bot-defense {
    description "L7DoS Lab - proactive browser verification with bot exceptions and rate limits"
    template strict
    enforcement-mode blocking
    grace-period 10
    single-page-application enabled
    cross-domain-requests validate-bulk
    #
    # deviceid-mode controls WHEN the device-ID JavaScript is injected:
    #   generate-before-access -> JS challenge BEFORE the request reaches the app
    #   generate-after-access  -> JS injected into the app's response (lower latency)
    #
    deviceid-mode generate-before-access
    #
    # Per-class actions. Verification applies only to Browser/Mobile classes;
    # mitigation (including rate-limit) applies to the bot classes.
    #
    class-overrides replace-all-with {
        Browser {
            verification {
                #
                # browser-verify-before-access  -> PROACTIVE: challenge is served
                #   first; the request only reaches the app after the browser
                #   solves the JS challenge and presents a valid cookie.
                #
                # To demonstrate the "after" variant, change this to:
                #   browser-verify-after-access-blocking   (challenge injected into
                #     the app response; mitigated on the NEXT request if it fails)
                #   browser-verify-after-access-detection  (same, but report-only)
                #
                action browser-verify-before-access
            }
        }
        "Trusted Bot" {
            #
            # Allow verified good bots (Google, Bing, ...) but CAP their rate so a
            # misbehaving or spoofed-then-verified crawler cannot overrun the app.
            #
            mitigation {
                action rate-limit
                rate-limit-tps 50
            }
        }
        "Untrusted Bot" {
            mitigation {
                action captcha
            }
        }
        "Malicious Bot" {
            mitigation {
                action block
            }
        }
        "Suspicious Browser" {
            mitigation {
                action captcha
            }
        }
    }
    #
    # Category-level exceptions: allow legitimate automation, block tooling.
    # action "none" = category not acted on (effectively allowed/transparent).
    #
    signature-category-overrides replace-all-with {
        "Search Engine" {
            action none
        }
        "Site Monitor" {
            action none
        }
        "Crawler" {
            action alarm
        }
        "HTTP Library" {
            action block
        }
        "DOS Tool" {
            action block
        }
    }
    #
    # Per-SIGNATURE rate limits: keep specific good bots online but bounded.
    # (rate-limit-tps is only meaningful when action is rate-limit.)
    #
    signature-overrides replace-all-with {
        Googlebot {
            action rate-limit
            rate-limit-tps 100
        }
        bingbot {
            action rate-limit
            rate-limit-tps 60
        }
    }
    #
    # Allowlist: skip verification and/or mitigation for known-safe paths and
    # internal monitoring sources.
    #
    whitelist replace-all-with {
        favicon {
            match-order 1
            url /favicon.ico
            disable-mitigation yes
            disable-verification yes
        }
        health_check {
            match-order 2
            url /health
            disable-mitigation yes
            disable-verification yes
        }
        internal_monitor {
            match-order 3
            #
            # A SPECIFIC monitoring/health-check host only. Do NOT whitelist the
            # whole client subnet (10.1.10.0/24) - it contains kali (10.1.10.100)
            # and the win-client, so a subnet allowlist would exempt the attacker.
            # EXAMPLE ONLY - replace with your real health-check/monitoring source.
            # (Note: 10.1.10.10 is the ELK / Device ID+ Kibana box, not a monitor.)
            #
            source-address 192.0.2.10/32
            disable-mitigation yes
        }
    }
}
