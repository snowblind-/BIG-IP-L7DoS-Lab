#-----------------------------------------------------------------------------
# Scenario 3.5 - Custom persistent DoS signatures
# (Security > DoS Protection > Signatures)
#
# PRIMARY WORKFLOW IS THE GUI (see lab5-persistent-signatures.rst). This file is
# the CLI supplement: the merge-loadable equivalent of a signature authored in
# the GUI, plus the commands to inspect, promote, approve, and share one. Keep
# it for version control / rebuild.
#
# A "persistent" DoS signature is permanent and is either:
#   * a user-defined signature you author with your own predicates (below), or
#   * a dynamic BADoS signature promoted with "Make Persistent".
#
# Object: security dos dos-signature. HTTP-family constraints enforced by TMOS:
#   type persistent (default) | origin user-defined (default) |
#   state learn-only|mitigate | threshold-mode manual |
#   detection/mitigation thresholds must be 0 |
#   approval-state manually-approved to mitigate under "use approved sigs only" |
#   shareability-state fully-shareable to apply to any signatures-enabled profile
#
# PREREQUISITE: the DoS profile on the VS must have application request-signature
# detection enabled. This lab uses lab_dos_bados_profile on vs-lab-dos
# (10.1.10.63). Load this file with:
#   tmsh load sys config merge file /var/tmp/dos-persistent-signature.conf
#-----------------------------------------------------------------------------

# --- User-defined persistent HTTP DoS signature -----------------------------
# Example: flag a scripted/header-less client - GET, no User-Agent header, short
# URI. Predicate metrics/operators below are real (captured from device output);
# available metrics can vary by TMOS version, so the GUI predicate builder is the
# source of truth for what your build offers.
security dos dos-signature lab_sig_scripted_flood {
    family http
    origin user-defined
    type persistent
    description "Lab 3.5: scripted flood - GET, no User-Agent, short URI"
    state mitigate
    approval-state manually-approved
    shareability-state fully-shareable
    manual-detection-threshold 0
    manual-mitigation-threshold 0
    hardware-offload disabled
    tags replace-all-with { Flood Lab }
    predicates {
        {
            arguments false
            metric http.user_agent_header_exists
            operator eq
        }
        {
            arguments GET
            metric http.request.method
            operator eq
        }
        {
            arguments 0-15
            metric http.uri_len
            operator between
        }
    }
}

# --- Inspect --------------------------------------------------------------
#   tmsh list security dos dos-signature lab_sig_scripted_flood
#   tmsh list security dos dos-signature { type dynamic }     # BADoS-generated
#   tmsh show security dos dos-signature lab_sig_scripted_flood   # attack status

# --- Promote a DYNAMIC (BADoS) signature to persistent --------------------
# After an attack, capture a useful dynamic signature and keep it:
#   tmsh modify security dos dos-signature <HTTPSig...> \
#       type persistent shareability-state fully-shareable \
#       approval-state manually-approved state mitigate
# (type may move dynamic -> persistent, never the reverse.)

# --- Metric vocabulary seen on-device (HTTP family) -----------------------
# Header presence/absence (arguments true|false, operator eq):
#   http.user_agent_header_exists  http.referer_header_exists
#   http.accept_header_exists      http.accept_encoding_header_exists
#   http.host_header_exists        http.pragma_header_exists
#   http.cache_control_header_exists  http.x_forwarded_for_header_exists
#   http.unknown_header_exists     http.<custom>_header_exists
# Value / shape:
#   http.request.method   eq            GET|POST|...
#   http.uri_len          between        0-15
#   http.uri_parameters   eq             no-query
#   http.uri_file         hashes-like    /
#   http.accept           contains       application
#   http.headers_count    eq             11
#   http.referer          hashes-like    <url>
#   http.hdrorder         hashes-to      <id>
#   http.cache_control    hashes-to      <id>
